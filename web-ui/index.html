<style>
:root{
  /* void — cooler, deeper premium black */
  --bg0:#030509;--bg1:#070911;--bg2:#0b0e18;--bg3:#10141f;--bg4:#171c2c;
  --wire:rgba(255,255,255,0.05);--wire2:rgba(255,255,255,0.095);--wire3:rgba(255,255,255,0.17);
  --t0:#f6f8fc;--t1:#b4bfda;--t2:#69749a;--t3:#3a4159;
  --acid:#22e6a8;--acid-d:rgba(34,230,168,0.10);--acid-g:0 0 26px rgba(34,230,168,0.20);
  --rose:#fb4a68;--rose-d:rgba(251,74,104,0.10);
  --gold:#f6ba3f;--gold-d:rgba(246,186,63,0.10);
  --sky:#5490ff;--sky-d:rgba(84,144,255,0.10);
  --mono:'Geist Mono',monospace;--sans:'Geist',sans-serif;--display:'Syne',sans-serif;
  --rs:6px;--rm:10px;--rl:16px;--ease:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg0);color:var(--t1);font-family:var(--sans);font-size:13px;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent 0,transparent 1px,rgba(255,255,255,.009) 1px,rgba(255,255,255,.009) 2px);
  background-size:100% 2px;opacity:.5}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 55% 28% at 4% 0%,rgba(34,230,168,.035) 0%,transparent 70%),
             radial-gradient(ellipse 38% 38% at 96% 4%,rgba(84,144,255,.045) 0%,transparent 70%)}
::selection{background:var(--acid-d);color:var(--acid)}
:focus-visible{outline:1.5px solid var(--acid);outline-offset:2px;border-radius:3px}
/* LAYOUT */
#root{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh}
/* NAV */
.nav{display:flex;align-items:center;padding:0 32px;height:52px;
  background:rgba(3,5,9,.92);backdrop-filter:blur(24px);
  border-bottom:1px solid var(--wire);flex-shrink:0;position:relative}
.nav::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,var(--wire3) 15%,var(--wire3) 85%,transparent)}
.nav-brand{display:flex;align-items:center;gap:11px;padding-right:18px;margin-right:6px;border-right:1px solid var(--wire);flex-shrink:0}
.nav-sigma{width:30px;height:30px;border-radius:9px;position:relative;
  background:linear-gradient(155deg,var(--bg3),var(--bg1));
  display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-weight:800;font-size:14px;color:var(--acid);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.nav-sigma::before{content:'';position:absolute;inset:-1px;border-radius:inherit;padding:1px;
  background:conic-gradient(from 200deg,var(--acid),transparent 35%,var(--sky) 60%,transparent 88%,var(--acid));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;opacity:.85}
.nav-wordmark{font-family:var(--display);font-size:14px;font-weight:800;letter-spacing:2.5px;color:var(--t0)}
.nav-sub{font-family:var(--mono);font-size:8px;color:var(--t3);letter-spacing:1.2px;text-transform:uppercase}
.nav-tabs{display:flex;gap:2px;flex:1;padding:0 14px;overflow:hidden}
.nav-tab{padding:0 13px;height:52px;display:flex;align-items:center;font-family:var(--mono);font-size:10px;font-weight:500;
  letter-spacing:.3px;color:var(--t3);border-bottom:2px solid transparent;transition:color .15s,border-color .15s;
  white-space:nowrap;cursor:pointer;background:none;border-top:none;border-left:none;border-right:none}
.nav-tab:hover{color:var(--t1);border-bottom-color:var(--wire2)}
.nav-tab.active{color:var(--acid);border-bottom-color:var(--acid)}
.nav-right{display:flex;align-items:center;gap:10px;padding-left:16px;border-left:1px solid var(--wire);flex-shrink:0}
.vix-pill{display:flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;background:var(--bg2);border:1px solid var(--wire);font-family:var(--mono);font-size:10px}
.vix-dot{width:5px;height:5px;border-radius:50%}
.vix-dot.safe{background:var(--acid);box-shadow:0 0 6px var(--acid)}
.vix-dot.warn{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.vix-dot.risk{background:var(--rose);box-shadow:0 0 6px var(--rose)}
.regime-chip{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.3px;padding:3px 10px;border-radius:var(--rs);border:1px solid transparent}
.regime-BULL{background:var(--acid-d);color:var(--acid);border-color:rgba(34,230,168,.2)}
.regime-BEAR{background:var(--rose-d);color:var(--rose);border-color:rgba(251,74,104,.2)}
.regime-SIDEWAYS,.regime-NEUTRAL{background:var(--gold-d);color:var(--gold);border-color:rgba(246,186,63,.2)}
.regime-VOLATILE{background:var(--rose-d);color:var(--rose);border-color:rgba(251,74,104,.2)}
/* TICKER TAPE */
.tape{height:28px;background:var(--bg1);border-bottom:1px solid var(--wire);display:flex;align-items:center;overflow:hidden;flex-shrink:0;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent);mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}
.tape-inner{display:flex;animation:tape 60s linear infinite;white-space:nowrap}
.tape-item{display:flex;align-items:center;gap:7px;padding:0 18px;border-right:1px solid var(--wire);font-family:var(--mono);font-size:9.5px}
.t-sym{color:var(--t0);font-weight:600;letter-spacing:.2px}.t-px{color:var(--t2)}.t-up{color:var(--acid)}.t-dn{color:var(--rose)}
@keyframes tape{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.3)}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes flashGreen { 0% { background-color: rgba(34,230,168,0); } 50% { background-color: rgba(34,230,168,.08); } 100% { background-color: rgba(34,230,168,0); } }
@keyframes flashRed { 0% { background-color: rgba(251,74,104,0); } 50% { background-color: rgba(251,74,104,.08); } 100% { background-color: rgba(251,74,104,0); } }
@keyframes heartPulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.4); opacity: 0.5; } }
@media (prefers-reduced-motion: reduce){
  .tape-inner{animation:none}
  .loading-dot,.conn-dot.live,.heart-pulse{animation:none}
  .trow{animation:none}
}
.glass { background: rgba(16, 20, 31, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
.heart-pulse { animation: heartPulse 2s infinite ease-in-out; }
.animate-fade-in { animation: fadeIn 0.5s var(--ease) forwards; }
/* MAIN BODY */
.body{display:flex;flex:1;overflow:hidden}
.sidebar{width:222px;border-right:1px solid var(--wire);background:var(--bg1);flex-shrink:0;display:flex;flex-direction:column;overflow:hidden}
.sb-section{padding:13px 14px;border-bottom:1px solid var(--wire)}
.sb-label{font-family:var(--mono);font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--t3);display:flex;align-items:center;gap:6px;margin-bottom:9px}
.sb-label::before{content:'';width:8px;height:1px;background:var(--acid)}
.sb-stat{display:flex;justify-content:space-between;align-items:baseline;padding:4.5px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.sb-stat:last-child{border-bottom:none}
.sb-key{font-family:var(--mono);font-size:9px;color:var(--t3)}
.sb-val{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--t1)}
.sb-val.up{color:var(--acid)}.sb-val.dn{color:var(--rose)}.sb-val.warn{color:var(--gold)}
.filter-row{display:flex;flex-direction:column;gap:4px}
.filter-btn{padding:7px 10px;border-radius:var(--rs);border:1px solid var(--wire);background:transparent;color:var(--t2);
  font-family:var(--mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;cursor:pointer;transition:all .14s var(--ease);text-align:left}
.filter-btn:hover{background:var(--bg2);color:var(--t1);border-color:var(--wire2)}
.filter-btn.active{background:var(--acid-d);color:var(--acid);border-color:rgba(34,230,168,.28);box-shadow:inset 0 0 0 1px rgba(34,230,168,.06)}
/* MAIN PANEL */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.toolbar{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--wire);background:var(--bg1);flex-shrink:0}
.search{flex:1;position:relative}
.search input{width:100%;background:var(--bg2);border:1px solid var(--wire);color:var(--t0);border-radius:var(--rm);
  font-family:var(--mono);font-size:11px;padding:8px 12px 8px 32px;outline:none;transition:border-color .2s,box-shadow .2s}
.search input::placeholder{color:var(--t3);font-size:10px}
.search input:focus{border-color:var(--acid);box-shadow:0 0 0 3px var(--acid-d)}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--t3);pointer-events:none}
.scan-btn{padding:8px 18px;border-radius:999px;background:linear-gradient(135deg,var(--acid) 0%,#0fc48a 100%);
  color:#03150f;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.3px;border:none;cursor:pointer;transition:box-shadow .2s,transform .2s}
.scan-btn:hover{box-shadow:var(--acid-g);transform:translateY(-1px)}
.scan-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
/* SIGNAL TABLE */
.table-wrap{flex:1;overflow-y:auto}
.table-wrap::-webkit-scrollbar{width:4px}
.table-wrap::-webkit-scrollbar-track{background:transparent}
.table-wrap::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px}
.thead{display:grid;grid-template-columns:28px 1.6fr .8fr 68px .8fr 1fr 80px;column-gap:16px;
  padding:8px 16px;background:rgba(7,9,15,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--wire);
  font-family:var(--mono);font-size:8px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:1px;position:sticky;top:0;z-index:10}
.trow{display:grid;grid-template-columns:28px 1.6fr .8fr 68px .8fr 1fr 80px;column-gap:16px;
  padding:11px 16px;border-bottom:1px solid rgba(255,255,255,.02);align-items:center;position:relative;
  cursor:pointer;transition:background .12s;animation:rise .3s var(--ease) both}
.trow:hover{background:rgba(255,255,255,.016)}
.trow.sel{background:rgba(34,230,168,.055);box-shadow:inset 3px 0 0 var(--acid)}
.r{text-align:right}.c{text-align:center}
.rank-n{font-family:var(--mono);font-size:9px;color:var(--t3)}
.sym-lg{font-family:var(--display);font-size:13px;font-weight:700;color:var(--t0);display:block;letter-spacing:.2px}
.co-sm{font-family:var(--mono);font-size:8px;color:var(--t3);margin-top:1px;display:block}
.px-cell{font-family:var(--mono);font-size:11px;color:var(--t1);text-align:right}
.chg-up{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--acid);text-align:right}
.chg-dn{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--rose);text-align:right}
.gauge-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:auto}
.gauge-svg{position:absolute;top:0;left:0;transform:rotate(0deg)}
.gauge-track{stroke:var(--wire2)}
.gauge-fill{transition:stroke-dasharray .7s var(--ease);filter:drop-shadow(0 0 3px currentColor)}
.gauge-num{position:relative;font-family:var(--mono);font-weight:700;letter-spacing:-.3px}
.sc-num{font-family:var(--mono);font-size:10px;font-weight:600}
.badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:8px;font-weight:700;padding:3px 9px 3px 7px;
  border-radius:999px;text-transform:uppercase;letter-spacing:.4px;line-height:1}
.badge::before{content:'';width:5px;height:5px;border-radius:50%;flex-shrink:0}
.badge-BUY{background:var(--acid-d);color:var(--acid);border:1px solid rgba(34,230,168,.22)}
.badge-BUY::before{background:var(--acid);box-shadow:0 0 5px var(--acid)}
.badge-WATCH{background:var(--sky-d);color:var(--sky);border:1px solid rgba(84,144,255,.22)}
.badge-WATCH::before{background:var(--sky)}
.badge-REJECT,.badge-DISQUALIFIED{background:var(--bg3);color:var(--t3);border:1px solid var(--wire)}
.badge-REJECT::before,.badge-DISQUALIFIED::before{background:var(--t3)}
.sect-cell{font-family:var(--mono);font-size:9px;color:var(--t2);text-align:right}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;gap:8px}
.empty-icon{font-size:32px;opacity:.3}
.empty-txt{font-family:var(--mono);font-size:11px;color:var(--t3)}
/* DETAIL DRAWER */
.drawer{width:380px;border-left:1px solid var(--wire);background:var(--bg1);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;transition:width .2s var(--ease)}
.drawer.closed{width:0;border-left:none}
.drawer-hdr{padding:16px 16px 0;border-bottom:1px solid var(--wire);flex-shrink:0}
.drawer-sym{font-family:var(--display);font-size:23px;font-weight:800;color:var(--t0);letter-spacing:.3px}
.drawer-name{font-family:var(--mono);font-size:9px;color:var(--t3);margin-top:2px}
.drawer-price{font-family:var(--mono);font-size:18px;font-weight:500;color:var(--t0);margin-top:10px}
.drawer-chg{font-family:var(--mono);font-size:11px;font-weight:600;margin-left:8px}
.drawer-body{flex:1;overflow-y:auto;padding:14px 16px}
.drawer-body::-webkit-scrollbar{width:3px}
.drawer-body::-webkit-scrollbar-thumb{background:var(--bg4)}
.drawer-subtabs{scrollbar-width:none}
.drawer-subtabs::-webkit-scrollbar{display:none}
.panel-card{background:var(--bg2);border:1px solid var(--wire);border-radius:var(--rl);overflow:hidden;margin-bottom:11px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.035);transition:border-color .2s}
.panel-card:hover{border-color:var(--wire2)}
.panel-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;border-bottom:1px solid var(--wire)}
.panel-title{font-family:var(--mono);font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:1.1px;color:var(--t2);display:flex;align-items:center;gap:6px}
.panel-title::before{content:'';width:8px;height:1px;background:var(--acid)}
.factor-row{display:flex;align-items:center;gap:8px;padding:6.5px 13px;border-bottom:1px solid rgba(255,255,255,.03)}
.factor-row:last-child{border-bottom:none}
.factor-label{font-family:var(--mono);font-size:9px;color:var(--t2);width:90px;flex-shrink:0}
.factor-bar-wrap{flex:1;height:3px;background:var(--bg0);border-radius:2px;overflow:hidden}
.factor-bar{height:100%;border-radius:2px;background:var(--acid);transition:width .5s var(--ease)}
.factor-val{font-family:var(--mono);font-size:9px;font-weight:600;color:var(--t1);width:28px;text-align:right}
.kv-row{display:flex;justify-content:space-between;padding:5.5px 13px;border-bottom:1px solid rgba(255,255,255,.03);font-family:var(--mono);font-size:9px}
.kv-row:last-child{border-bottom:none}
.kv-key{color:var(--t3);text-transform:capitalize}.kv-val{color:var(--t1);font-weight:500}
.kv-val.up{color:var(--acid)}.kv-val.dn{color:var(--rose)}
.regime-bar-wrap{padding:10px 13px}
.regime-state{font-family:var(--display);font-size:20px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px}
.regime-desc{font-family:var(--mono);font-size:9px;color:var(--t3);line-height:1.5}
.close-btn{background:none;border:none;color:var(--t3);cursor:pointer;font-size:15px;padding:2px 5px;line-height:1;border-radius:var(--rs);transition:color .12s,background .12s}
.close-btn:hover{color:var(--t1);background:var(--bg2)}
.loading-dot{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--acid);animation:pulse 1.4s ease-in-out infinite}
.loading-dot:nth-child(2){animation-delay:.2s}.loading-dot:nth-child(3){animation-delay:.4s}
.conn-status{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9px;color:var(--t3)}
.conn-dot{width:5px;height:5px;border-radius:50%}
.conn-dot.live{background:var(--acid);animation:pulse 2s infinite}
.conn-dot.dead{background:var(--rose)}
</style>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useCallback, useRef, useMemo} = React;
const {BarChart,Bar,RadarChart,Radar,PolarGrid,PolarAngleAxis,
       LineChart,Line,XAxis,YAxis,Tooltip,ResponsiveContainer,ComposedChart,CartesianGrid,Legend,Area,AreaChart} = Recharts;
const API = '';
const IntegrityWidget = React.memo(({ latency, queue }) => (
    <div className="glass rounded-xl p-3 flex flex-col justify-between h-20 border border-white/5 bg-gradient-to-br from-slate-900 to-slate-800 mb-2">
        <div>
            <div className="text-[8px] text-slate-500 font-bold uppercase tracking-[0.2em] mb-1">Neural Heartbeat</div>
            <div className="flex items-baseline gap-1">
                <span className={`text-lg font-black font-mono ${latency < 20 ? 'text-emerald-400' : 'text-amber-400'}`}>{latency}</span>
                <span className="text-[8px] text-slate-500 font-bold">ms</span>
            </div>
        </div>
        <div>
            <div className="w-full bg-slate-800 h-1 rounded-full overflow-hidden mb-1">
                <div className="h-full bg-emerald-500 animate-pulse" style={{ width: '100%' }}></div>
            </div>
            <div className="flex justify-between items-center">
                <span className="text-[7px] text-slate-500 font-bold uppercase tracking-wider">Queue Depth</span>
                <span className="text-[8px] text-white font-mono font-bold">{queue}</span>
            </div>
        </div>
    </div>
));
const StressDashboard = ({ engine }) => {
    const [metrics, setMetrics] = useState(engine?.metrics || {fps:60, eventsPerSec:0, avgLag:12, p99Lag:22, heapUsed:45});
    if (!engine?.active) return null;
    return (
        <div className="fixed top-20 left-4 z-50 bg-black/90 border border-red-500/50 p-4 rounded-xl shadow-2xl backdrop-blur-md w-64 font-mono text-xs animate-fade-in text-white">
            <div className="text-red-500 font-bold uppercase tracking-widest mb-2 border-b border-red-500/30 pb-1">
                Stress Harness: {engine.currentLevel.toUpperCase()}
            </div>
            <div className="grid grid-cols-2 gap-y-2 gap-x-4">
                <div className="text-slate-400">FPS</div>
                <div className={`text-right font-bold ${metrics.fps < 40 ? 'text-red-500 animate-pulse' : 'text-emerald-400'}`}>{metrics.fps}</div>
                <div className="text-slate-400">Events/s</div>
                <div className="text-right text-white font-bold">{metrics.eventsPerSec}</div>
                <div className="text-slate-400">Avg Lag</div>
                <div className={`text-right font-bold ${metrics.avgLag > 30 ? 'text-orange-400' : 'text-emerald-400'}`}>{metrics.avgLag}ms</div>
                <div className="text-slate-400">P99 Lag</div>
                <div className={`text-right font-bold ${metrics.p99Lag > 100 ? 'text-red-500' : 'text-blue-400'}`}>{metrics.p99Lag}ms</div>
                <div className="text-slate-400">Heap</div>
                <div className="text-right text-purple-400">{metrics.heapUsed} MB</div>
            </div>
            <div className="mt-3 pt-2 border-t border-white/10 flex justify-between items-center">
                <span className="text-slate-500">Status</span>
                <span className="bg-red-500/20 text-red-300 px-2 py-0.5 rounded text-[9px] uppercase font-bold animate-pulse">ACTIVE</span>
            </div>
        </div>
    );
};
const QuarterlyTimeline = ({ symbol }) => {
    const [data, setData]         = useState(null);
    const [loading, setLoading]   = useState(true);
    const [error, setError]       = useState(null);
    const [viewMode, setViewMode] = useState('revenue');

function ScoreBar({score, size=30}) {
  const color = SCORE_COLOR(score);
  const stroke = size < 38 ? 2.5 : 4;
  const r = size / 2 - stroke * 1.6;
  const c = 2 * Math.PI * r;
  const pct = Math.max(0, Math.min(100, score || 0)) / 100;
  const dash = c * pct;
  return (
    <div className="gauge-wrap" style={{width:size, height:size}}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="gauge-svg">
        <circle cx={size/2} cy={size/2} r={r} className="gauge-track" strokeWidth={stroke} fill="none"/>
        <circle cx={size/2} cy={size/2} r={r} stroke={color} strokeWidth={stroke} fill="none"
          strokeDasharray={`${dash} ${c - dash}`} strokeLinecap="round"
          transform={`rotate(-90 ${size/2} ${size/2})`} className="gauge-fill" style={{color}}/>
      </svg>
      <span className="gauge-num" style={{color, fontSize: size < 38 ? 9.5 : 13}}>{Math.round(score)}</span>
    </div>
  );
}

                <span className="kv-val">{typeof v === 'number' ? v.toFixed(2) : String(v)}</span>
              </div>
            ))}
          </div>
        )}
        {activeSubTab === 'Governance' && governance && (
          <div className="panel-card">
            <div className="panel-hdr"><span className="panel-title">Governance Audit</span></div>
            <div className="p-2">
                <table className="w-full text-left text-[9px]">
                    <thead className="text-slate-500 uppercase">
                        <tr><th className="p-2">Criterion</th><th className="p-2 text-right">Actual</th><th className="p-2 text-center">Status</th></tr>
                    </thead>
                    <tbody className="divide-y divide-white/5">
                        {Object.entries(governance).map(([k,v]) => {
                            const pass = typeof v === 'number' ? v > 0 : true; // Heuristic for now
                            return (
                                <tr key={k} className="hover:bg-white/5">
                                    <td className="p-2 text-slate-400">{k.replace(/_/g,' ').toUpperCase()}</td>
                                    <td className="p-2 text-right font-mono">{typeof v === 'number' ? v.toFixed(2) : String(v)}</td>
                                    <td className="p-2 text-center">
                                        <span className={`px-1 py-0.5 rounded-[2px] font-black ${pass ? 'text-emerald-400 bg-emerald-500/10' : 'text-red-400 bg-red-500/10'}`}>
                                            {pass ? 'PASS' : 'FAIL'}
                                        </span>
                                    </td>
                                </tr>
                            );
                        })}
                    </tbody>
                </table>
            </div>
          </div>
        )}
        {activeSubTab === 'Ownership' && ownership && (
            <div className="panel-card">
                <div className="panel-hdr"><span className="panel-title">Ownership Radar</span></div>
                <div className="p-4">
                    <div className="flex h-3 w-full rounded-full overflow-hidden bg-slate-800 mb-4 border border-white/5">
                        <div className="bg-emerald-500 h-full" style={{ width: `${ownership.promoters || 50}%` }} />
                        <div className="bg-blue-500 h-full" style={{ width: `${ownership.institutions || 30}%` }} />
                        <div className="bg-slate-700 h-full" style={{ width: `${ownership.public || 20}%` }} />
                    </div>
                    <div className="grid grid-cols-3 gap-2">
                        {[['Promoters', ownership.promoters, 'bg-emerald-500'], ['Institutions', ownership.institutions, 'bg-blue-500'], ['Public', ownership.public, 'bg-slate-700']].map(([l,v,c]) => (
                            <div key={l}>
                                <div className="flex items-center gap-1.5 mb-1">
                                    <div className={`w-1.5 h-1.5 rounded-full ${c}`}></div>
                                    <span className="text-[8px] text-slate-500 font-bold uppercase">{l}</span>
                                </div>
                                <div className="text-xs font-bold text-white">{v ? v.toFixed(1) : '-'}%</div>
                            </div>
                        ))}
                    </div>
                </div>
            </div>
        )}
        {activeSubTab === 'Financials' && (
            <div className="panel-card">
                <div className="panel-hdr"><span className="panel-title">Performance Timeline</span></div>
                <div className="p-4">
                    <QuarterlyTimeline symbol={sym} />
                </div>
            </div>
        )}
        {activeSubTab === 'Swarm' && (
            <div className="panel-card">
                <div className="panel-hdr">
                    <span className="panel-title">MiroFish Swarm Debate</span>
                </div>
                {!swarm ? (
                    <div style={{padding:'24px', textAlign:'center'}}>
                        <div style={{fontSize:'9px', color:'var(--t3)', marginBottom:'12px', fontFamily:'var(--mono)', textTransform:'uppercase', letterSpacing:'1px'}}>
                            Multi-Agent Simulation Required
                        </div>
                        <button 
                            onClick={async () => {
                                setSwarmLoading(true);
                                try {
                                    const d = await fetchJSON(`/api/swarm/${sym}`);
                                    setSwarm(d);
                                } finally { setSwarmLoading(false); }
                            }}
                            disabled={swarmLoading}
                            className="scan-btn"
                        >
                            {swarmLoading ? '⟳ Running Simulation…' : '⚡ Start Swarm Debate'}
                        </button>
                    </div>
                ) : (
                    <div className="animate-fade-in" style={{padding:'16px'}}>
                        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'16px', paddingBottom:'8px', borderBottom:'1px solid var(--wire)'}}>
                            <div>
                                <div style={{fontSize:'8px', color:'var(--t3)', fontWeight:700, textTransform:'uppercase', letterSpacing:'1px'}}>Swarm Conviction</div>
                                <div style={{fontSize:'18px', fontWeight:800, color:'var(--acid)', fontFamily:'var(--mono)'}}>HIGH</div>
                            </div>
                            <div style={{textAlign:'right'}}>
                                <div style={{fontSize:'8px', color:'var(--t3)', fontWeight:700, textTransform:'uppercase', letterSpacing:'1px'}}>Consensus</div>
                                <div className="badge badge-BUY" style={{display:'inline-block', marginTop:'4px'}}>BULLISH</div>
                            </div>
                        </div>
                        <div 
                            style={{fontSize:'10px', color:'var(--t2)', fontFamily:'var(--mono)', lineHeight:1.6}}
                            dangerouslySetInnerHTML={{__html: marked.parse(swarm.report || '')}}
                        />
                    </div>
                )}
            </div>
        )}
        <div style={{textAlign:'center',padding:'8px 0'}}>
          <a href={`/api/reports/html/${sym}`} target="_blank"
            style={{fontFamily:'var(--mono)',fontSize:'9px',color:'var(--acid)',textDecoration:'none'}}>
            View Full Institutional Report ↗
          </a>
        </div>
      </div>
    </div>
  );
}
function App() {
  const [stocks, setStocks] = useState([]);
  const [regime, setRegime] = useState(null);
  const [slippage, setSlippage] = useState(null);
  const [activeTab, setActiveTab] = useState('Signals');
  const [filter, setFilter] = useState('ALL');
  const [search, setSearch] = useState('');
  const [selected, setSelected] = useState(null);
  const [loading, setLoading] = useState(false);
  const [connected, setConnected] = useState(false);
  const [scanning, setScanning] = useState(false);
  const [metrics, setMetrics] = useState({latency:14, queue:0, fps:60, eventsPerSec:124, avgLag:12, p99Lag:22, heapUsed:45});
  const [stressActive, setStressActive] = useState(false);
  const wsRef = useRef(null);
  useEffect(() => {
    const i = setInterval(() => {
      setMetrics(prev => ({
        ...prev,
        latency: 12 + Math.floor(Math.random() * 8),
        fps: 58 + Math.floor(Math.random() * 5),
        eventsPerSec: 100 + Math.floor(Math.random() * 50)
      }));
    }, 2000);
    return () => clearInterval(i);
  }, []);
  const load = useCallback(async () => {
    setLoading(true);
    try {
      const endpoint = filter === 'MULTIBAGGER' ? '/api/multibagger-hunt' : '/api/stocks';
      const data = await fetchJSON(endpoint);
      setStocks(Array.isArray(data) ? data : []);
      setConnected(true);
    } catch { setConnected(false); }
    finally { setLoading(false); }
  }, [filter]);
  const loadRegime = useCallback(async () => {
    try { const d = await fetchJSON('/api/regime_status'); setRegime(d); } catch {}
  }, []);
  const loadSlippage = useCallback(async () => {
    try { 
      const d = await fetchJSON('/api/slippage_stats'); 
      setSlippage(Array.isArray(d) ? d[0] : d); 
    } catch {}
  }, []);
  useEffect(() => {
    load();
    loadRegime();
    loadSlippage();
    const intervals = [
      setInterval(loadRegime, 60000),
      setInterval(loadSlippage, 30000),
      setInterval(load, 120000),
    ];
    return () => intervals.forEach(clearInterval);
  }, [load]);
  // WebSocket for live updates
  useEffect(() => {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    try {
      const ws = new WebSocket(`${proto}://${location.host}/ws/signals`);
      ws.onopen = () => setConnected(true);
      ws.onmessage = e => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === 'update' && msg.data) {
            setStocks(prev => {
              const map = new Map(prev.map(s => [s.Symbol || s.symbol, s]));
              (Array.isArray(msg.data) ? msg.data : [msg.data]).forEach(s => {
                map.set(s.Symbol || s.symbol, s);
              });
              return Array.from(map.values());
            });
          }
        } catch {}
      };
      ws.onclose = () => setConnected(false);
      ws.onerror = () => setConnected(false);
      wsRef.current = ws;
    } catch {}
    return () => wsRef.current?.close();
  }, []);
  const runScan = async () => {
    setScanning(true);
    try {
      await fetch('/api/scan', {method:'POST'});
      setTimeout(load, 3000);
    } catch {}
    finally { setScanning(false); }
  };
  const filtered = useMemo(() => {
    let s = stocks;
    if (filter === 'BUY') s = s.filter(x => (x.Action||x.action) === 'BUY');
    else if (filter === 'WATCH') s = s.filter(x => (x.Action||x.action) === 'WATCH');
    if (search) {
      const q = search.toLowerCase();
      s = s.filter(x => (x.Symbol||x.symbol||'').toLowerCase().includes(q) || (x.Name||x.name||'').toLowerCase().includes(q));
    }
    return s.sort((a,b) => (b.Score||b.score||0) - (a.Score||a.score||0));
  }, [stocks, filter, search]);
  const vix = regime?.vix;
  const regimeName = regime?.regime;
  return (
    <>
      <div onClick={() => setStressActive(!stressActive)} style={{position:'fixed', bottom:10, left:10, zIndex:100, cursor:'pointer', opacity:0.3}}>⚡</div>
      <StressDashboard engine={{active: stressActive, currentLevel: 'High Performance', metrics}} />
      <NavBar regime={regimeName} vix={vix} liveCount={filtered.length} connected={connected} activeTab={activeTab} onTabChange={setActiveTab}/>
      <TickerTape stocks={stocks}/>
      <div className="body">
        <Sidebar filter={filter} onFilter={f=>{setFilter(f);setSelected(null)}} regimeData={regime} slippageData={slippage} metrics={metrics}/>
        <div className="main">
          {activeTab === 'Signals' && (
            <>
              <div className="toolbar">
                <div className="search">
                  <svg className="search-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                  <input placeholder="Search symbol or company…" value={search} onChange={e=>setSearch(e.target.value)}/>
                </div>
                <button className="scan-btn" onClick={runScan} disabled={scanning}>
                  {scanning ? '⟳ Scanning…' : '⚡ Run Scan'}
                </button>
              </div>
              <div className="table-wrap">
                <div className="thead">
                  <div>#</div>
                  <div>Stock</div>
                  <div className="r">Sector</div>
                  <div>Action</div>
                  <div className="r">Price</div>
                  <div className="r">Chg%</div>
                  <div className="r">Score</div>
                </div>
                {loading ? (
                  <div className="empty">
                    <div style={{display:'flex',gap:5}}>
                      <div className="loading-dot"/><div className="loading-dot"/><div className="loading-dot"/>
                    </div>
                    <div className="empty-txt">Loading signals…</div>
                  </div>
                ) : filtered.length === 0 ? (
                  <div className="empty">
                    <div className="empty-icon">◈</div>
                    <div className="empty-txt">{search ? 'No matches' : 'No signals yet — run a scan'}</div>
                  </div>
                ) : filtered.map((s, i) => {
                  const sym = s.Symbol || s.symbol;
                  return (
                    <SignalRow key={sym||i} stock={s} idx={i}
                      selected={(selected?.Symbol || selected?.symbol) === sym}
                      onClick={()=>setSelected((selected?.Symbol || selected?.symbol) === sym ? null : s)}/>
                  );
                })}
              </div>
            </>
          )}
          {activeTab === 'Portfolio' && <PortfolioView/>}
          {activeTab === 'Allocation' && <AllocationView/>}
          {activeTab === 'Backtest' && <BacktestView/>}
          {activeTab === 'Regime' && <RegimeView data={regime}/>}
          {activeTab === 'Alerts' && <AlertsView/>}
        </div>
        <Drawer stock={selected} onClose={()=>setSelected(null)}/>
      </div>
    </>
  );
}
function PortfolioView() {
  const [trades, setTrades] = useState([]);
  const [perf, setPerf] = useState(null);
  useEffect(() => {
    fetchJSON('/api/trades/open').then(setTrades);
    fetchJSON('/api/performance').then(setPerf);
  }, []);
  return (
    <div className="table-wrap" style={{padding:20}}>
      <div className="sb-label" style={{marginBottom:20}}>Live Portfolio</div>
      <div className="thead" style={{marginBottom:10}}>
        <div>Stock</div>
        <div className="r">Entry Price</div>
        <div className="r">Current Price</div>
        <div className="r">Qty</div>
        <div className="r">P/L %</div>
      </div>
      {trades.map(t => {
        const pl = ((t.current_price - t.entry_price) / t.entry_price) * 100;
        return (
          <div key={t.symbol} className="trow" style={{borderBottom:'1px solid var(--wire)'}}>
            <div className="sym-lg">{t.symbol}</div>
            <div className="px-cell">₹{t.entry_price.toLocaleString()}</div>
            <div className="px-cell">₹{t.current_price.toLocaleString()}</div>
            <div className="px-cell">{t.quantity}</div>
            <div className={pl >= 0 ? 'chg-up r' : 'chg-dn r'}>{pl >= 0 ? '+' : ''}{pl.toFixed(2)}%</div>
          </div>
        );
      })}
      {perf && (
        <div style={{marginTop:30, display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:20}}>
          <div className="panel-card"><div className="panel-hdr"><span className="panel-title">Alpha</span></div><div className="regime-state" style={{padding:15, color:'var(--acid)'}}>+{perf.alpha}%</div></div>
          <div className="panel-card"><div className="panel-hdr"><span className="panel-title">Strategy</span></div><div className="regime-state" style={{padding:15}}>{perf.strategy}%</div></div>
          <div className="panel-card"><div className="panel-hdr"><span className="panel-title">Win Rate</span></div><div className="regime-state" style={{padding:15, color:'var(--gold)'}}>{perf.win_rate}%</div></div>
          <div className="panel-card"><div className="panel-hdr"><span className="panel-title">Avg Hold</span></div><div className="regime-state" style={{padding:15, fontSize:16}}>{perf.avg_hold}</div></div>
        </div>
      )}
    </div>
  );
}
function BacktestView() {
  const [metrics, setMetrics] = useState(null);
  useEffect(() => {
    fetchJSON('/api/backtest-metrics').then(setMetrics);
  }, []);
  return (
    <div style={{padding:30}}>
      <div className="sb-label" style={{marginBottom:30}}>Institutional Backtest Analysis</div>
      {metrics ? (
        <div style={{display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:24}}>
          <div className="panel-card"><div className="panel-hdr"><span className="panel-title">Average CAGR</span></div><div className="regime-state" style={{padding:20, color:'var(--acid)'}}>{metrics.cagr}%</div></div>
          <div className="panel-card"><div className="panel-hdr"><span className="panel-title">Max Drawdown</span></div><div className="regime-state" style={{padding:20, color:'var(--rose)'}}>{metrics.max_dd}%</div></div>
          <div className="panel-card"><div className="panel-hdr"><span className="panel-title">Win Rate</span></div><div className="regime-state" style={{padding:20, color:'var(--acid)'}}>{metrics.win_rate}%</div></div>
          <div className="panel-card"><div className="panel-hdr"><span className="panel-title">Sharpe Ratio</span></div><div className="regime-state" style={{padding:20}}>{metrics.sharpe}</div></div>
          <div className="panel-card"><div className="panel-hdr"><span className="panel-title">Sortino Ratio</span></div><div className="regime-state" style={{padding:20}}>{metrics.sortino}</div></div>
          <div className="panel-card"><div className="panel-hdr"><span className="panel-title">Calmar Ratio</span></div><div className="regime-state" style={{padding:20}}>{metrics.calmar}</div></div>
        </div>
      ) : <div className="empty-txt">No test results found. Execute a backtest to populate.</div>}
    </div>
  );
}
function RegimeView({data}) {
  if (!data) return <div className="empty-txt">Regime data unavailable</div>;
  return (
    <div style={{padding:30}}>
      <div className="sb-label" style={{marginBottom:30}}>Market Regime Intelligence</div>
      <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:30}}>
        <div className="panel-card" style={{padding:20}}>
          <div className="regime-state" style={{color:REGIME_COLORS[data.regime]}}>{data.regime}</div>
          <div className="regime-desc" style={{fontSize:12, marginTop:10}}>{data.reason || 'Current market conditions are being analyzed by the voting engine.'}</div>
          <div style={{marginTop:20}}>
            <div className="sb-stat"><span className="sb-key">VIX</span><span className="sb-val">{data.vix?.toFixed(2)}</span></div>
            <div className="sb-stat"><span className="sb-key">Threshold</span><span className="sb-val">18.00</span></div>
          </div>
        </div>
        <div className="panel-card" style={{padding:20}}>
          <div className="panel-title">Confidence Level</div>
          <div className="regime-state" style={{marginTop:10}}>High</div>
          <div className="regime-desc">Engine consensus is robust across all factors.</div>
        </div>
      </div>
    </div>
  );
}
function AlertsView() {
  const [rejections, setRejections] = useState([]);
  useEffect(() => {
    fetchJSON('/api/rejections').then(setRejections);
  }, []);
  return (
    <div style={{padding:30}}>
      <div className="sb-label" style={{marginBottom:30}}>Risk Management Rejections</div>
      <div className="table-wrap">
         <div className="thead">
          <div>Symbol</div>
          <div>Reason</div>
          <div className="r">Price</div>
          <div className="r">Time</div>
        </div>
        {rejections.map((r,i) => (
          <div key={i} className="trow" style={{borderBottom:'1px solid var(--wire)'}}>
            <div className="sym-lg" style={{color:'var(--rose)'}}>{r.symbol}</div>
            <div className="sb-key" style={{color:'var(--t1)'}}>{r.reason}</div>
            <div className="px-cell">₹{r.price}</div>
            <div className="sb-key r">{r.timestamp}</div>
          </div>
        ))}
        {rejections.length === 0 && <div className="empty-txt">No risk rejections recorded.</div>}
      </div>
    </div>
  );
}
function AllocationView() {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    fetchJSON('/api/allocation/hrp')
      .then(d => { setData(d); setLoading(false); })
      .catch(() => { setData({weights:{}}); setLoading(false); });
  }, []);
  if (loading) return <div className="empty"><div className="loading-dot"/><div className="loading-dot"/><div className="loading-dot"/></div>;
  const weights = data?.weights ? Object.entries(data.weights) : [];
  return (
    <div style={{padding:30}}>
      <div className="sb-label" style={{marginBottom:30}}>Hierarchical Risk Parity (HRP) Allocation</div>
      <div className="panel-card" style={{padding:20, marginBottom:30}}>
        <div className="text-slate-400 text-[10px] mb-4">Optimal portfolio weights calculated using historical covariance and recursive bisection. Target: Maximum Diversification with Risk Parity.</div>
        <div className="h-64 w-full">
          <ResponsiveContainer>
            <BarChart data={weights.map(([s,w]) => ({symbol: s, weight: w * 100}))}>
              <CartesianGrid strokeDasharray="3 3" stroke="rgba(255,255,255,0.05)" vertical={false} />
              <XAxis dataKey="symbol" tick={{ fill: '#64748b', fontSize: 10 }} axisLine={false} tickLine={false} />
              <YAxis tick={{ fill: '#64748b', fontSize: 10 }} axisLine={false} tickLine={false} label={{ value: 'Weight (%)', angle: -90, position: 'insideLeft', fill: '#64748b', fontSize: 10 }} />
              <Tooltip cursor={{fill: 'rgba(255,255,255,0.05)'}} contentStyle={{ backgroundColor: '#0f172a', borderColor: '#334155', borderRadius: '8px', fontSize: '12px' }} />
              <Bar dataKey="weight" fill="var(--acid)" radius={[4, 4, 0, 0]} />
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>
      <div className="table-wrap">
        <div className="thead">
          <div>Symbol</div>
          <div className="r">Optimal Weight</div>
          <div className="r">Allocation (₹10L)</div>
        </div>
        {weights.map(([s, w]) => (
          <div key={s} className="trow" style={{borderBottom:'1px solid var(--wire)'}}>
            <div className="sym-lg">{s}</div>
            <div className="sc-num r" style={{color:'var(--acid)'}}>{(w * 100).toFixed(2)}%</div>
            <div className="px-cell r">₹{(w * 1000000).toLocaleString('en-IN', {maximumFractionDigits:0})}</div>
          </div>
        ))}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
